[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "outreach-desk"
version = "2.0.0"
description = "A self-hosted outreach desk: Claude writes the emails, Jev makes the calls, you approve every send. With an n8n node."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Owen Alderson" }]
keywords = ["outreach", "cold-email", "crm", "claude", "jev", "typesafe", "n8n", "fastapi", "htmx"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlmodel>=0.0.22",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "anthropic>=1.11",
    "typesafe-sdk>=0.7",
    "system-one-adapter[anthropic]>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
outreach-desk = "outreach_desk.__main__:main"

[project.urls]
Homepage = "https://github.com/owen-alderson/outreach-desk"

[tool.hatch.build.targets.sdist]
exclude = ["n8n-node", "n8n", "docs", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
